<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Visual Essay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="street">
        <div class="background-arrows" aria-hidden="true">
            <svg class="background-arrow arrow-one" viewBox="0 0 200 300" focusable="false">
                <path d="M100 0 0 110h55v190h90V110h55z"></path>
            </svg>
            <svg class="background-arrow arrow-two" viewBox="0 0 200 300" focusable="false">
                <path d="M100 0 0 110h55v190h90V110h55z"></path>
            </svg>
            <svg class="background-arrow arrow-three" viewBox="0 0 200 300" focusable="false">
                <path d="M100 0 0 110h55v190h90V110h55z"></path>
            </svg>
            <svg class="background-arrow arrow-four" viewBox="0 0 200 300" focusable="false">
                <path d="M100 0 0 110h55v190h90V110h55z"></path>
            </svg>
        </div>
        <div class="road-marking" aria-hidden="true"></div>

        <section class="opening" aria-label="Opening photograph">
            <figure class="photo opening-photo" data-scroll-image>
                <img
                    src="./camera%20copy.jpg"
                    alt="A street scene viewed from the camera"
                    fetchpriority="high"
                    decoding="async">
            </figure>

            <figure class="photo opening-pondlife" data-scroll-image>
                <img src="./pondlife.jpg" alt="Handwritten reflection about surveillance in Brooklyn" loading="eager" decoding="async">
            </figure>
        </section>

        <section class="photo-sequence" aria-label="Photographs along the street">
            <figure class="photo photo-one" data-scroll-image>
                <img src="./beatlescd.jpg" alt="A notebook resting on a city park bench" loading="lazy" decoding="async">
            </figure>

            <figure class="photo benchfriends-photo" data-scroll-image>
                <img src="./benchfriends.jpg" alt="Friends sitting together on a bench" loading="lazy" decoding="async">
            </figure>

            <figure class="photo photo-two" data-scroll-image>
                <img src="./sur%20copy.jpg" alt="A person and belongings on a city sidewalk" loading="lazy" decoding="async">
            </figure>

            <figure class="photo floating-photo float-left" data-scroll-image>
                <img src="./33350033.JPG" alt="A neon-lit storefront at night" loading="lazy" decoding="async">
            </figure>

            <div class="subway-photo-pair">
                <figure class="photo subway-car-photo" data-scroll-image>
                    <img src="./updatedsubway.jpg" alt="Passengers riding a subway car" loading="lazy" decoding="async">
                </figure>

                <figure class="photo subway-hand-photo" data-scroll-image>
                    <img src="./updated%20hand%20copy.jpg" alt="A hand resting on a seat inside a subway car" loading="lazy" decoding="async">
                </figure>
            </div>

            <div class="street-photo-pair">
                <figure class="photo" data-scroll-image>
                    <img src="./tennisballman.jpg" alt="A person using a walker fitted with tennis balls" loading="lazy" decoding="async">
                </figure>

                <figure class="photo" data-scroll-image>
                    <img src="./red%20copy.jpg" alt="A person with red hair sitting on a city stairway" loading="lazy" decoding="async">
                </figure>
            </div>

            <figure class="photo floating-photo float-right" data-scroll-image>
                <img src="./gratis.jpg" alt="A free item sign on a city street" loading="lazy" decoding="async">
            </figure>

            <figure class="photo floating-photo float-right" data-scroll-image>
                <img src="./meme%20copy.jpg" alt="A surveillance-themed street artwork" loading="lazy" decoding="async">
            </figure>

            <figure class="photo floating-photo float-left" data-scroll-image>
                <img src="./open.jpg" alt="A glowing open sign outside a storefront" loading="lazy" decoding="async">
            </figure>

            <figure class="photo floating-photo float-right" data-scroll-image>
                <img src="./bump.jpg" alt="People sitting along a row of park benches" loading="lazy" decoding="async">
            </figure>
        </section>

        <section class="crossroads" aria-label="Street crossing photo gallery">
            <div class="cross-street" tabindex="0" aria-label="Photo gallery. Scroll or swipe horizontally to explore.">
                <div class="cross-street-spacer" aria-hidden="true"></div>

                <figure class="photo crossing-photo" data-scroll-image>
                    <img src="./croppededitcoke.jpg" alt="A city building entrance and steps" loading="lazy" decoding="async">
                </figure>

                <figure class="photo crossing-photo" data-scroll-image>
                    <img src="./home%20cut%20out.jpg" alt="A bed and personal belongings arranged beside the street" loading="lazy" decoding="async">
                </figure>

                <figure class="photo crossing-photo" data-scroll-image>
                    <img src="./hostile.jpg" alt="A security camera mounted on a stone building" loading="lazy" decoding="async">
                </figure>

                <figure class="photo crossing-photo" data-scroll-image>
                    <img src="./work.jpg" alt="Workers on scaffolding beside a brick building" loading="lazy" decoding="async">
                </figure>

                <div class="cross-street-spacer" aria-hidden="true"></div>
            </div>
        </section>

        <section class="poem-credit" aria-label="Poem title and author">
            <h2>
                <span class="title-fragment title-fragment-first">Having a Coke</span>
                <span class="title-fragment title-fragment-second">with You</span>
            </h2>
            <p>Frank O’Hara</p>
        </section>

        <section class="photo-sequence ending-sequence" aria-label="More photographs along the street">
            <figure class="photo floating-photo float-left" data-scroll-image>
                <img src="./cut%20up%20me.jpg" alt="A person resting on a bed in a bedroom" loading="lazy" decoding="async">
            </figure>

            <figure class="photo floating-photo float-right" data-scroll-image>
                <img src="./IMG_4381.jpg" alt="A printed neighborhood poster on a white background" loading="lazy" decoding="async">
            </figure>

            <figure class="photo floating-photo float-left" data-scroll-image>
                <img src="./police%20and%20interiro.jpg" alt="A police car paired with interior diagrams in a photo collage" loading="lazy" decoding="async">
            </figure>

            <figure class="photo floating-photo float-left" data-scroll-image>
                <img src="./eun.jpg" alt="Handwritten reflection about a neighbor named Eun" loading="lazy" decoding="async">
            </figure>

            <figure class="photo floating-photo float-right" data-scroll-image>
                <img src="./updatestep.jpg" alt="Updated photograph of a New York stoop and steps" loading="lazy" decoding="async">
            </figure>

            <div class="building-collage">
                <figure class="photo end-building" data-scroll-image>
                    <img src="./bigbuildings.jpg" alt="A cutout view looking up at city skyscrapers" loading="lazy" decoding="async">
                </figure>

                <figure class="photo building-notes" data-scroll-image>
                    <img src="./bigbuildingnote%20copy.jpg" alt="Handwritten notes reflecting on New York's towering buildings" loading="lazy" decoding="async">
                </figure>

                <figure class="photo building-eight" data-scroll-image>
                    <img src="./0008.jpg" alt="A printed image of the New York skyline" loading="lazy" decoding="async">
                </figure>

                <figure class="photo building-street-photo" data-scroll-image>
                    <img src="./33740034.jpg" alt="Tall city buildings seen from street level" loading="lazy" decoding="async">
                </figure>

                <figure class="photo pink-spray-photo" data-scroll-image>
                    <img src="./pinkspray.jpg" alt="Pink spray paint across two textured heart shapes" loading="lazy" decoding="async">
                </figure>

                <figure class="photo tissue-photo" data-scroll-image>
                    <img src="./tissue%20copy.jpg" alt="A tissue lying on a city sidewalk" loading="lazy" decoding="async">
                </figure>
            </div>
        </section>
    </main>

    <script>
        if (!window.location.hash) {
            window.scrollTo(0, 0);
        }

        const photos = document.querySelectorAll("[data-scroll-image]");
        const crossStreet = document.querySelector(".cross-street");

        if ("IntersectionObserver" in window) {
            document.documentElement.classList.add("has-scroll-reveal");

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    entry.target.classList.toggle("is-visible", entry.isIntersecting);
                });
            }, {
                threshold: 0.15
            });

            photos.forEach((photo) => observer.observe(photo));
        }

        if (crossStreet) {
            crossStreet.scrollLeft = (crossStreet.scrollWidth - crossStreet.clientWidth) / 2;
        }
    </script>
</body>
</html>
